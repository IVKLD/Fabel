[package]
name = "fabel"
version = "1.0.0"
default-run = "fabel"
edition = "2021"
authors = ["Principal Security Architecture Team"]
description = "Host-based Threat Detection, Counter-Surveillance & Hardening Engine for NixOS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/IVKLD/Fabel"
homepage = "https://github.com/IVKLD/Fabel"
keywords = ["nixos", "security", "audit", "hardening", "anti-surveillance"]
categories = ["command-line-utilities", "security-tools"]

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
needless_borrow = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"

[lib]
name = "fabel"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
x509-parser = "0.16"
libc = "0.2"
