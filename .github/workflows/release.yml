name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build with Flake
        run: nix build

      - name: Package Binary
        run: |
          mkdir -p release-artifacts
          cp result/bin/fabel release-artifacts/fabel-x86_64-linux
          chmod +x release-artifacts/fabel-x86_64-linux
          cd release-artifacts
          tar -czvf fabel-x86_64-linux.tar.gz fabel-x86_64-linux
          sha256sum fabel-x86_64-linux.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/fabel-x86_64-linux.tar.gz
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
